[package]
name = "ferrum-torrens"
version = "0.1.0"
edition = "2024"
description = "Minimal single-GPU MoE serving engine (FreeToken port)"

[[bin]]
name = "ferrum-torrens"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
memmap2 = "0.9"
toml = "0.8"

[dev-dependencies]
mockall = "0.13"

[profile.release]
lto = "thin"