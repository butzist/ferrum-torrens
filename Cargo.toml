[package]
name = "ferrum-torrens"
version = "0.1.0"
edition = "2024"
description = "Minimal single-GPU MoE serving engine (FreeToken port)"

[[bin]]
name = "ferrum-torrens"
path = "src/main.rs"

[features]
default = []
# GPU compute backend. Off by default because tch's build script needs
# libtorch at build time, which would break the CPU-only unit suite; enable
# inside the devshell, where the flake supplies LIBTORCH_INCLUDE/LIBTORCH_LIB.
# default-features = false drops `download-libtorch` so nothing is fetched.
cuda = ["dep:tch"]
# The Triton NVFP4 expert kernel (D4). pyo3 embeds an interpreter so the kernel
# module can own the device slot cache; `auto-initialize` links the interpreter
# found by the build, which is the Nix python, not the venv's.
triton = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
memmap2 = "0.9"
toml = "0.8"
tokenizers = "0.21"
axum = "0.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
futures-core = "0.3"
tch = { version = "0.22", default-features = false, optional = true }
pyo3 = { version = "0.29.3", features = ["auto-initialize"], optional = true }
minijinja = { version = "2.24.0", features = ["serde"] }

[dev-dependencies]
mockall = "0.13"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
